<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>

<body>
    <h1>Calculadora</h1>

    <input type="number" name="" id="n1" placeholder="Digite o Primeiro Numero">

    <input type="number" name="" id="n2" placeholder="Dogite o Segundo Numero">

    <input type="radio" name="calcular" id="mais" value="MAIS"> +
    <input type="radio" name="calcular" id="menos" value="MENOS"> -
    <input type="radio" name="calcular" id="vezes" value="VEZES"> x
    <input type="radio" name="calcular" id="dividir" value="DIVIDIR"> /

    <button onclick="clicar()">=</button>

    <div id="resultado"></div>

    <script>
        let n1 = document.getElementById("n1");
        let n2 = document.getElementById("n2");

        let resultado = document.getElementById("resultado");

        resultado.style.paddingTop = "10px"
        resultado.style.display = "flex"

        function clicar() {

            resultado.innerHTML = "";

            let primeiroNumero = Number(n1.value);
            let segundoNumero = Number(n2.value);

            let soma = primeiroNumero + segundoNumero;
            let subtração = primeiroNumero - segundoNumero;
            let dividir = primeiroNumero / segundoNumero;
            let multiplicar = primeiroNumero * segundoNumero;

            let escolher = document.querySelector('input[name="calcular"]:checked');

            if (n1.value.trim() === "" || n2.value.trim() === "") {
                window.alert("[ERRO] Dados incorretos, verifique e tente novamente!")
                return
            }

            if (escolher == null) {
                window.alert("[ERRO] Selecione uma operação!")
                return
            }




            if (escolher.value == "MAIS") {
                resultado.innerHTML = `Resultado: ${soma}`;
            } else if (escolher.value == "MENOS") {
                resultado.innerHTML = `Resultado: ${subtração}`
            } else if (escolher.value == "VEZES") {
                resultado.innerHTML = `Resultado: ${multiplicar}`
            } else if (escolher.value == "DIVIDIR") {
                if (segundoNumero == 0) {
                    window.alert("[ERRO] NÃO DA PARA DIVIDIR NENHUM NUMERO POR ZERO, TENTE NOVAMENTE!");
                    return;
                } else{
                    resultado.innerHTML = `Resultado: ${dividir}`
                }
        }
        }


    </script>
</body>

</html>
